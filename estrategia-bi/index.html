<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Estratégia APS — Benefício por Incapacidade</title>
<style>
  :root{
    --bg:#0f1419;
    --panel:#161c24;
    --panel2:#1d2530;
    --border:#2a3340;
    --text:#e8edf3;
    --muted:#8b97a6;
    --accent:#3b82f6;
    --accent2:#60a5fa;
    --ativo:#22c55e;
    --cessado:#f59e0b;
    --negado:#ef4444;
    --analise:#a78bfa;
    --naoinformado:#475569;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI',Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:24px;
  }
  h1{
    font-size:20px;
    margin:0 0 4px 0;
    font-weight:600;
  }
  .subtitle{
    color:var(--muted);
    font-size:13px;
    margin-bottom:20px;
  }
  .toolbar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    margin-bottom:18px;
  }
  input[type=text], select{
    background:var(--panel2);
    border:1px solid var(--border);
    color:var(--text);
    padding:8px 10px;
    border-radius:6px;
    font-size:13px;
  }
  input[type=text]{min-width:220px;}
  .stats{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:18px;
  }
  .stat{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:8px;
    padding:10px 14px;
    min-width:110px;
  }
  .stat .num{font-size:20px;font-weight:700;}
  .stat .lbl{font-size:11px;color:var(--muted);margin-top:2px;}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;}
  .cards{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
  }
  .card-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 16px;
    cursor:pointer;
    gap:12px;
  }
  .card-head:hover{background:var(--panel2);}
  .ch-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .name{font-weight:600;font-size:14px;}
  .cpf{color:var(--muted);font-size:12px;}
  .badge{
    font-size:11px;
    padding:3px 9px;
    border-radius:20px;
    font-weight:600;
    white-space:nowrap;
  }
  .badge-ativo{background:rgba(34,197,94,.15);color:var(--ativo);border:1px solid rgba(34,197,94,.4);}
  .badge-cessado{background:rgba(245,158,11,.15);color:var(--cessado);border:1px solid rgba(245,158,11,.4);}
  .badge-negado{background:rgba(239,68,68,.15);color:var(--negado);border:1px solid rgba(239,68,68,.4);}
  .badge-analise{background:rgba(167,139,250,.15);color:var(--analise);border:1px solid rgba(167,139,250,.4);}
  .badge-naoinformado{background:rgba(71,85,105,.2);color:var(--muted);border:1px solid var(--border);}
  .reqcount{font-size:11px;color:var(--muted);}
  .chev{color:var(--muted);font-size:12px;transition:transform .15s;}
  .card.open .chev{transform:rotate(90deg);}
  .card-body{
    display:none;
    padding:0 16px 16px 16px;
    border-top:1px solid var(--border);
  }
  .card.open .card-body{display:block;}
  .hist{
    margin:14px 0;
    font-size:12px;
  }
  .hist-title{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
  table.hist-table{width:100%;border-collapse:collapse;}
  table.hist-table td{padding:5px 8px;border-bottom:1px solid var(--border);font-size:12px;}
  table.hist-table tr:last-child td{border-bottom:none;}
  .field-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:14px;
  }
  .field-grid .full{grid-column:1/-1;}
  label{
    display:block;
    font-size:11px;
    color:var(--muted);
    margin-bottom:4px;
    text-transform:uppercase;
    letter-spacing:.03em;
  }
  textarea, .field-grid select, .field-grid input{
    width:100%;
    background:var(--panel2);
    border:1px solid var(--border);
    color:var(--text);
    padding:8px 10px;
    border-radius:6px;
    font-size:13px;
    font-family:inherit;
    resize:vertical;
  }
  textarea{min-height:60px;}
  .save-row{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:10px;
    margin-top:12px;
  }
  .save-msg{font-size:12px;color:var(--ativo);opacity:0;transition:opacity .3s;}
  .save-msg.show{opacity:1;}
  button.save{
    background:var(--accent);
    color:#fff;
    border:none;
    padding:8px 16px;
    border-radius:6px;
    font-size:13px;
    cursor:pointer;
    font-weight:600;
  }
  button.save:hover{background:var(--accent2);}
  .empty{color:var(--muted);font-size:13px;padding:20px;text-align:center;}
  .loading{color:var(--muted);font-size:13px;padding:20px;text-align:center;}
</style>
</head>

const STATUS_LABELS = {
  ativo: "Ativo",
  cessado: "Cessado",
  negado: "Negado",
  analise: "Em análise / recurso",
  naoinformado: "Não informado"
};

let clientsState = {}; // cpf -> {status, dataCessacao, motivoNegativa, estrategia, observacoes}
let order = [];

function slug(cpf){ return cpf.replace(/\D/g,''); }

async function loadAll(){
  const root = document.getElementById('root');
  for(const c of SEED_CLIENTS){
    const key = 'bi:' + slug(c.cpf);
    try{
      const res = await window.storage.get(key);
      clientsState[c.cpf] = res ? JSON.parse(res.value) : {status:'naoinformado', dataCessacao:'', motivoNegativa:'', estrategia:'', observacoes:''};
    }catch(e){
      clientsState[c.cpf] = {status:'naoinformado', dataCessacao:'', motivoNegativa:'', estrategia:'', observacoes:''};
    }
  }
  order = SEED_CLIENTS.map(c => c.cpf);
  render();
}

function computeStats(){
  const counts = {ativo:0, cessado:0, negado:0, analise:0, naoinformado:0};
  for(const cpf of order){
    const st = clientsState[cpf]?.status || 'naoinformado';
    counts[st] = (counts[st]||0) + 1;
  }
  return counts;
}

function renderStats(){
  const counts = computeStats();
  const colors = {ativo:'var(--ativo)', cessado:'var(--cessado)', negado:'var(--negado)', analise:'var(--analise)', naoinformado:'var(--naoinformado)'};
  const statsEl = document.getElementById('stats');
  statsEl.innerHTML = `
    <div class="stat"><div class="num">${SEED_CLIENTS.length}</div><div class="lbl">Total de clientes</div></div>
    ${Object.keys(STATUS_LABELS).map(k => `
      <div class="stat"><div class="num"><span class="dot" style="background:${colors[k]}"></span>${counts[k]||0}</div><div class="lbl">${STATUS_LABELS[k]}</div></div>
    `).join('')}
  `;
}

function matchesFilters(c){
  const search = document.getElementById('search').value.trim().toLowerCase();
  const filterStatus = document.getElementById('filterStatus').value;
  const st = clientsState[c.cpf]?.status || 'naoinformado';
  if(filterStatus && st !== filterStatus) return false;
  if(search){
    const hay = (c.nome + ' ' + c.cpf).toLowerCase();
    if(!hay.includes(search)) return false;
  }
  return true;
}

function render(){
  renderStats();
  const root = document.getElementById('root');
  const visible = SEED_CLIENTS.filter(matchesFilters);
  if(visible.length === 0){
    root.innerHTML = '<div class="empty">Nenhum cliente encontrado com esses filtros.</div>';
    return;
  }
  root.innerHTML = `<div class="cards">${visible.map(cardHtml).join('')}</div>`;

  visible.forEach(c => {
    const key = slug(c.cpf);
    document.getElementById('head-'+key).addEventListener('click', () => {
      document.getElementById('card-'+key).classList.toggle('open');
    });
    document.getElementById('save-'+key).addEventListener('click', () => saveClient(c.cpf));
  });
}

function badgeHtml(status){
  return `<span class="badge badge-${status}">${STATUS_LABELS[status]}</span>`;
}

function cardHtml(c){
  const key = slug(c.cpf);
  const st = clientsState[c.cpf] || {status:'naoinformado', dataCessacao:'', motivoNegativa:'', estrategia:'', observacoes:''};
  const reqs = c.requerimentos.slice().reverse();
  return `
  <div class="card" id="card-${key}">
    <div class="card-head" id="head-${key}">
      <div class="ch-left">
        <span class="name">${c.nome}</span>
        <span class="cpf">${c.cpf}</span>
        ${badgeHtml(st.status)}
        <span class="reqcount">${c.requerimentos.length} requerimento${c.requerimentos.length>1?'s':''}</span>
      </div>
      <span class="chev">▶</span>
    </div>
    <div class="card-body">
      <div class="hist">
        <div class="hist-title">Histórico de requerimentos (INSS)</div>
        <table class="hist-table">
          ${reqs.map(r => `<tr>
            <td>${r.protocolo}</td>
            <td>${r.data}</td>
            <td>${r.unidade}</td>
            <td>Últ. atualização: ${r.ultimaAtualizacao}</td>
          </tr>`).join('')}
        </table>
      </div>

      <div class="field-grid">
        <div>
          <label>Status atual</label>
          <select id="status-${key}">
            ${Object.keys(STATUS_LABELS).map(k => `<option value="${k}" ${st.status===k?'selected':''}>${STATUS_LABELS[k]}</option>`).join('')}
          </select>
        </div>
        <div>
          <label>Data de cessação (se houver)</label>
          <input type="text" id="cessacao-${key}" placeholder="DD/MM/AAAA" value="${escapeHtml(st.dataCessacao||'')}">
        </div>
        <div class="full">
          <label>Motivo da(s) negativa(s) anterior(es)</label>
          <textarea id="motivo-${key}" placeholder="Ex: perícia considerou capacidade laborativa preservada; ausência de qualidade de segurado; documentação médica insuficiente...">${escapeHtml(st.motivoNegativa||'')}</textarea>
        </div>
        <div class="full">
          <label>Estratégia para novo protocolo / recurso</label>
          <textarea id="estrategia-${key}" placeholder="Ex: reunir novos laudos, juntar exames complementares, protocolar com CID atualizado, ingressar com recurso na junta de recursos...">${escapeHtml(st.estrategia||'')}</textarea>
        </div>
        <div class="full">
          <label>Observações</label>
          <textarea id="obs-${key}" placeholder="Outras anotações relevantes do caso">${escapeHtml(st.observacoes||'')}</textarea>
        </div>
      </div>

      <div class="save-row">
        <span class="save-msg" id="msg-${key}">Salvo ✓</span>
        <button class="save" id="save-${key}">Salvar</button>
      </div>
    </div>
  </div>`;
}

function escapeHtml(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function saveClient(cpf){
  const key = slug(cpf);
  const data = {
    status: document.getElementById('status-'+key).value,
    dataCessacao: document.getElementById('cessacao-'+key).value,
    motivoNegativa: document.getElementById('motivo-'+key).value,
    estrategia: document.getElementById('estrategia-'+key).value,
    observacoes: document.getElementById('obs-'+key).value
  };
  clientsState[cpf] = data;
  try{
    await window.storage.set('bi:' + key, JSON.stringify(data));
    const msg = document.getElementById('msg-'+key);
    msg.classList.add('show');
    setTimeout(()=>msg.classList.remove('show'), 1500);
    renderStats();
    const badge = document.querySelector('#head-'+key+' .badge');
    if(badge){
      badge.className = 'badge badge-' + data.status;
      badge.textContent = STATUS_LABELS[data.status];
    }
  }catch(e){
    alert('Erro ao salvar. Tente novamente.');
  }
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('filterStatus').addEventListener('change', render);

loadAll();
</script>
</body>
</html>
