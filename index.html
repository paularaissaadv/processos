  function parseDataLocal(dateStr) {
    // Evita o bug de timezone: "2026-06-16" não pode ser interpretado como UTC,
    // senão em fusos negativos (Brasil) ele "volta" um dia.
    if (!dateStr) return null;
    const partes = String(dateStr).split('-');
    if (partes.length !== 3) { const d = new Date(dateStr); return isNaN(d) ? null : d; }
    const [ano, mes, dia] = partes.map(Number);
    const d = new Date(ano, mes - 1, dia);
    return isNaN(d) ? null : d;
  }
  function diasSem(dateStr) {
    const d = parseDataLocal(dateStr);
    if (!d) return 999;
    const hoje = new Date(); hoje.setHours(0,0,0,0);
    d.setHours(0,0,0,0);
    return Math.floor((hoje - d) / 86400000);
  }

  }

    p120: { label: '+120 dias',   cor: '#7f1d1d' },
    p90:  { label: '90–120 dias', cor: '#ef4444' },
    p60:  { label: '60–80 dias',  cor: '#f97316' },
    p30:  { label: '30–60 dias',  cor: '#eab308' },
    p0:   { label: 'até 30 dias', cor: '#22c55e' },
  };
  function urgencia(p) {
    if (!p.diligencia || !p.diligencia.trim()) return 'ok';
    if (p.prioridade === 'urgente') return 'urgente';
    return 'atencao'; // padrão: atenção, até ser marcado como urgente
  }
  const URG = {
    urgente: { label: 'URGENTE',        cor: '#ef4444', bg: '#dc2626' },
    atencao: { label: 'ATENÇÃO',        cor: '#eab308', bg: '#ca8a04' },
    ok:      { label: 'SEM DILIGÊNCIA', cor: '#475569', bg: '#475569' },
  };

  function fmtData(d) {
    if (!d) return '—';
    const dt = parseDataLocal(d);
    if (!dt) return d;
    return dt.toLocaleDateString('pt-BR');
  }
  function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // ── FIREBASE: escuta tempo real ──
  function escutar() {
    if (unsubscribe) unsubscribe();
    const q = query(collection(db, 'processos'));
    unsubscribe = onSnapshot(q, snap => {
      processos = snap.docs.map(d => ({ fbId: d.id, ...d.data() }));
      renderAtivo();
      atualizarHeader();
    }, err => {
      if (err.code === 'unavailable' || err.message.includes('offline')) return;
      mostrarToast('Erro ao conectar ao banco de dados.', 'erro');
    });
  }

  // ── FIREBASE: importar dados iniciais ──
  const VERSAO_DADOS = "v3"; // incrementar aqui força reimportação completa

  async function importarDadosIniciais() {
    // Verifica se a importação desta versão já foi concluída
    const flagSnap = await getDocs(collection(db, 'config'));
    const jaImportou = flagSnap.docs.some(d =>
      d.data().importacaoInicial === true && d.data().versao === VERSAO_DADOS
    );
    if (jaImportou) return;

    // Busca o que já existe no Firebase
    const snap = await getDocs(collection(db, 'processos'));
    const numerosExistentes = new Set(snap.docs.map(d => d.data().numero));

    // Remove processos que não estão mais na lista atual (foram arquivados)
    const numerosAtuais = new Set(DADOS_INICIAIS.map(p => p.numero));
    const parasExcluir = snap.docs.filter(d => !numerosAtuais.has(d.data().numero));
    for (const d of parasExcluir) {
      await deleteDoc(doc(db, 'processos', d.id));
    }
    if (parasExcluir.length > 0) {
      mostrarToast(`${parasExcluir.length} processos arquivados removidos.`, 'info');
    }

    // Importa os que ainda não existem
    const faltando = DADOS_INICIAIS.filter(p => !numerosExistentes.has(p.numero));
    if (faltando.length > 0) {
      mostrarToast(`Importando ${faltando.length} processos...`, 'info');
      const LOTE = 15;
      let total = 0;
      for (let i = 0; i < faltando.length; i += LOTE) {
        const lote = faltando.slice(i, i + LOTE);
        for (const p of lote) {
          const { id, concluido, ...dados } = p;
          await addDoc(collection(db, 'processos'), {
            ...dados,
            concluido: false,
            comentarios: [],
            criadoEm: serverTimestamp(),
            atualizadoEm: serverTimestamp(),
          });
          total++;
        }
        await new Promise(r => setTimeout(r, 800));
        mostrarToast(`Importando... ${total}/${faltando.length}`, 'info');
      }
      mostrarToast(total + ' processos importados!', 'ok');
    }

    // Grava flag com versão — futuras exclusões manuais não voltam mais
    await addDoc(collection(db, 'config'), {
      importacaoInicial: true,
      versao: VERSAO_DADOS,
      concluidaEm: serverTimestamp()
    });
  }

  // ── FIREBASE: salvar processo ──
  async function salvarProcesso(dados) {
    try {
      if (modalModo === 'editar' && processoAtivo?.fbId) {
        await updateDoc(doc(db, 'processos', processoAtivo.fbId), {
          ...dados, atualizadoEm: serverTimestamp()
        });
        mostrarToast('Processo atualizado!', 'ok');
      } else {
        await addDoc(collection(db, 'processos'), {
          ...dados, comentarios: [], concluido: false,
          criadoEm: serverTimestamp(), atualizadoEm: serverTimestamp()
        });
        mostrarToast('Processo adicionado!', 'ok');
      }
      fecharModal();
    } catch(e) { mostrarToast('Erro ao salvar: ' + e.message, 'erro'); }
  }

  // ── FIREBASE: atualizar status ──
  async function salvarStatus(dados) {
    try {
      await updateDoc(doc(db, 'processos', processoAtivo.fbId), {
        ...dados, atualizadoEm: serverTimestamp()
      });
      mostrarToast('Status atualizado!', 'ok');
      fecharModal();
    } catch(e) { mostrarToast('Erro: ' + e.message, 'erro'); }
  }

  // ── FIREBASE: excluir ──
  async function excluirProcesso(fbId) {
    if (!confirm('Excluir este processo permanentemente?')) return;
    try {
      await deleteDoc(doc(db, 'processos', fbId));
      mostrarToast('Processo excluído.', 'ok');
    } catch(e) { mostrarToast('Erro ao excluir.', 'erro'); }
  }

  // ── FILTROS ──
  function getF() {
    return {
      busca: (document.getElementById('busca')?.value || '').toLowerCase(),
      tribunal: document.getElementById('filtroTribunal')?.value || '',
      fase: document.getElementById('filtroFase')?.value || '',
      urg: document.getElementById('filtroUrg')?.value || '',
      parado: document.getElementById('filtroParado')?.value || '',
      papel: document.getElementById('filtroPapel')?.value || '',
    };
  }
  function filtrar(lista) {
    const f = getF();
    return lista.filter(p => {
      const u = urgencia(p);
      const fp = faixaParado(diasSem(p.dataUltimoMovimento));
      return (!f.tribunal || p.tribunal === f.tribunal)
          && (!f.fase || p.fase === f.fase)
          && (!f.urg || u === f.urg)
          && (!f.parado || fp === f.parado)
          && (!f.papel || (f.papel === 'adv' && p.papel === 'adv') || (f.papel === 'equipe' && p.papel !== 'adv'))
          && (!f.busca || (p.numero||'').toLowerCase().includes(f.busca)
              || (p.autor||'').toLowerCase().includes(f.busca)
              || (p.reu||'').toLowerCase().includes(f.busca)
              || (p.diligencia||'').toLowerCase().includes(f.busca));
    });
  }

  // ── RENDER PAINEL ──
  function renderPainel() {
    const lista = filtrar(processos);
    const pendentes = lista.filter(p => p.diligencia && p.diligencia.trim());
    const totalUrgente = processos.filter(p => urgencia(p)==='urgente').length;
    const totalAtencao = processos.filter(p => urgencia(p)==='atencao').length;
    const semDilig = processos.filter(p => !p.diligencia || !p.diligencia.trim()).length;

    let html = `<div class="stats">
      <div class="stat" style="--c:#3b82f6"><div class="stat-n">${processos.length}</div><div class="stat-l">Total</div></div>
      <div class="stat" style="--c:#ef4444"><div class="stat-n">${totalUrgente}</div><div class="stat-l">Urgentes</div></div>
      <div class="stat" style="--c:#eab308"><div class="stat-n">${totalAtencao}</div><div class="stat-l">Atenção</div></div>
      <div class="stat" style="--c:#475569"><div class="stat-n">${semDilig}</div><div class="stat-l">Sem diligência</div></div>
    </div>`;

    document.getElementById('count').textContent = pendentes.length + ' exibidos';

    const niveis = ['urgente','atencao'];
    let algum = false;
    for (const n of niveis) {
      const grupo = pendentes.filter(p => urgencia(p) === n);
      if (!grupo.length) continue;
      algum = true;
      const u = URG[n];
      html += `<div class="sec-header">
        <span class="sec-badge" style="background:${u.bg}">${u.label}</span>
        <span class="sec-count">${grupo.length} processo(s)</span>
      </div><div class="cards">`;
      for (const p of grupo) {
        const dias = diasSem(p.dataUltimoMovimento);
        const coments = (p.comentarios||[]).length;
        html += cardHTML(p, dias, coments);
      }
      html += '</div>';
    }
    if (!algum) html += '<div class="vazio">✅ Nenhuma diligência pendente.</div>';
    document.getElementById('page-painel').innerHTML = html;
    bindCards();
  }

  // ── RENDER TODOS ──
  function renderTodos() {
    const lista = filtrar(processos);
    document.getElementById('count').textContent = lista.length + ' exibidos';
    if (!lista.length) {
      document.getElementById('page-todos').innerHTML = '<div class="vazio">Nenhum processo encontrado.</div>';
      return;
    }
    let rows = '';
    for (const p of lista) {
      const u = urgencia(p);
      const dias = diasSem(p.dataUltimoMovimento);
      const fp = faixaParado(dias);
      const coments = (p.comentarios||[]).length;
      rows += `<tr data-fbid="${p.fbId}">
        <td><span class="mini-badge" style="background:${URG[u].bg}">${URG[u].label}</span></td>
        <td><span class="mini-badge" style="background:${PARADO[fp].cor}">${PARADO[fp].label}</span></td>
        <td class="td-num">${esc(p.numero)}</td>
        <td>${esc(p.tribunal)}</td>
        <td><strong>${esc(p.autor)}</strong><br><span class="td-muted">vs ${esc(p.reu)}</span></td>
        <td>${esc(p.fase)}</td>
        <td>${esc(p.ultimoMovimento)}<br><span class="td-muted">${fmtData(p.dataUltimoMovimento)} · ${dias}d</span></td>
        <td class="td-dilig">${esc(p.diligencia)}</td>
        <td>${coments > 0 ? `<span class="coment-badge">${coments}</span>` : '—'}</td>
        <td class="td-acoes">
          <button class="btn-sm btn-status" data-fbid="${p.fbId}">Status</button>
          <button class="btn-sm btn-editar" data-fbid="${p.fbId}">Editar</button>
          <button class="btn-sm btn-excluir" data-fbid="${p.fbId}">✕</button>
        </td>
      </tr>`;
    }
    document.getElementById('page-todos').innerHTML = `
      <div class="table-wrap"><table>
        <thead><tr><th>Status</th><th>Parado</th><th>Processo</th><th>Tribunal</th><th>Partes</th><th>Fase</th><th>Último mov.</th><th>Diligência</th><th>💬</th><th>Ações</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>`;
    bindTodos();
  }

  function cardHTML(p, dias, coments) {
    const fp = faixaParado(dias);
    const listaComents = (p.comentarios||[]);
    const comentariosHTML = listaComents.length
      ? `<div class="card-coments">
          <div class="card-coments-title">💬 Comentários da equipe</div>
          ${listaComents.map(c => `
            <div class="card-coment-item">
              <div class="card-coment-header">
                <span class="card-coment-autor">${esc(c.autor)}</span>
                ${c.data ? `<span class="card-coment-data">📅 ${esc(c.data)}</span>` : ''}
              </div>
              <div class="card-coment-texto">${esc(c.texto)}</div>
            </div>
          `).join('')}
        </div>`
      : '';
    return `<div class="card border-${urgencia(p)}" data-fbid="${p.fbId}">
      <div class="card-body">
        <div class="card-meta">
          <span class="card-num">${esc(p.numero)}</span>
          <span class="card-trib">${esc(p.tribunal)}</span>
          <span class="mini-badge" style="background:${PARADO[fp].cor}">${PARADO[fp].label}</span>
          ${p.situacaoAtual ? `<span class="card-sit">${esc(p.situacaoAtual)}</span>` : ''}
        </div>
        <div class="card-autor">${esc(p.autor)}</div>
        <div class="card-reu">vs ${esc(p.reu)}</div>
        ${p.diligencia ? `<div class="card-dilig">📌 ${esc(p.diligencia)}</div>` : ''}
        ${p.observacao && p.observacao !== 'nan' ? `<div class="card-obs">🗒️ ${esc(p.observacao)}</div>` : ''}
        ${comentariosHTML}
        <div class="card-footer">
          <span class="card-fase">${esc(p.fase)}</span>
          <span class="card-mov">${esc(p.ultimoMovimento)} · ${fmtData(p.dataUltimoMovimento)}</span>
        </div>
      </div>
      <div class="card-acoes">
        <button class="btn-sm btn-status" data-fbid="${p.fbId}">Atualizar status</button>
        <button class="btn-sm btn-editar" data-fbid="${p.fbId}">Editar</button>
      </div>
    </div>`;
  }

  function bindCards() {
    document.querySelectorAll('.btn-status').forEach(b => b.onclick = () => abrirStatus(b.dataset.fbid));
    document.querySelectorAll('.btn-editar').forEach(b => b.onclick = () => abrirEditar(b.dataset.fbid));
  }
  function bindTodos() {
    document.querySelectorAll('.btn-status').forEach(b => b.onclick = () => abrirStatus(b.dataset.fbid));
    document.querySelectorAll('.btn-editar').forEach(b => b.onclick = () => abrirEditar(b.dataset.fbid));
    document.querySelectorAll('.btn-excluir').forEach(b => b.onclick = () => excluirProcesso(b.dataset.fbid));
  }

  // ── RENDER GERAL ──
  function renderAtivo() {
    if (abaAtual === 'painel') renderPainel();
    else renderTodos();
  }

  // ── HEADER ──
  function atualizarHeader() {
    const urg = processos.filter(p => urgencia(p) === 'urgente').length;
    document.getElementById('badge-crit').textContent = urg + ' urgentes';
    document.getElementById('badge-total').textContent = processos.length + ' processos';
    document.getElementById('badge-data').textContent = new Date().toLocaleDateString('pt-BR');
  }

  // ── MODAL EDITAR/NOVO ──
  function abrirNovo() {
    modalModo = 'novo'; processoAtivo = null;
    document.getElementById('modal-titulo').textContent = 'Novo Processo';
    limparForm();
    document.getElementById('modal-edicao').style.display = 'flex';
  }
  function abrirEditar(fbId) {
    processoAtivo = processos.find(p => p.fbId === fbId);
    if (!processoAtivo) return;
    modalModo = 'editar';
    document.getElementById('modal-titulo').textContent = 'Editar Processo';
    preencherForm(processoAtivo);
    document.getElementById('modal-edicao').style.display = 'flex';
  }
  function limparForm() {
    ['f-numero','f-tribunal','f-orgao','f-autor','f-reu','f-fase','f-ultimoMov','f-dataMov','f-situacao','f-diligencia','f-obs'].forEach(id => {
      const el = document.getElementById(id); if(el) el.value = '';
    });
    document.getElementById('f-dataMov').value = new Date().toISOString().split('T')[0];
    document.getElementById('f-prio-atencao').checked = true;
  }
  function preencherForm(p) {
    document.getElementById('f-numero').value = p.numero || '';
    document.getElementById('f-tribunal').value = p.tribunal || '';
    document.getElementById('f-orgao').value = p.orgao || '';
    document.getElementById('f-autor').value = p.autor || '';
    document.getElementById('f-reu').value = p.reu || '';
    document.getElementById('f-fase').value = p.fase || '';
    document.getElementById('f-ultimoMov').value = p.ultimoMovimento || '';
    document.getElementById('f-dataMov').value = p.dataUltimoMovimento || '';
    document.getElementById('f-situacao').value = p.situacaoAtual || '';
    document.getElementById('f-diligencia').value = p.diligencia || '';
    const prioAtual = p.prioridade === 'urgente' ? 'urgente' : 'atencao';
    document.getElementById('f-prio-urgente').checked = prioAtual === 'urgente';
    document.getElementById('f-prio-atencao').checked = prioAtual === 'atencao';
    document.getElementById('f-obs').value = (p.observacao === 'nan' ? '' : p.observacao) || '';
  }
  function submitForm() {
    const numero = document.getElementById('f-numero').value.trim();
    if (!numero) { mostrarToast('Informe o número do processo.', 'erro'); return; }
    const dados = {
      numero, tribunal: document.getElementById('f-tribunal').value.trim(),
      orgao: document.getElementById('f-orgao').value.trim(),
      autor: document.getElementById('f-autor').value.trim(),
      reu: document.getElementById('f-reu').value.trim(),
      fase: document.getElementById('f-fase').value.trim(),
      ultimoMovimento: document.getElementById('f-ultimoMov').value.trim(),
      dataUltimoMovimento: document.getElementById('f-dataMov').value,
      situacaoAtual: document.getElementById('f-situacao').value.trim(),
      diligencia: document.getElementById('f-diligencia').value.trim(),
      prioridade: document.querySelector('input[name="f-prio"]:checked')?.value || 'atencao',
      observacao: document.getElementById('f-obs').value.trim(),
    };
    salvarProcesso(dados);
  }

  // ── MODAL STATUS ──
  function abrirStatus(fbId) {
    processoAtivo = processos.find(p => p.fbId === fbId);
    if (!processoAtivo) return;
    modalModo = 'status';
    renderComentarios();
    const p = processoAtivo;
    document.getElementById('status-titulo').textContent = p.numero;
    document.getElementById('status-autor').textContent = p.autor + ' vs ' + p.reu;
    document.getElementById('status-dilig').textContent = p.diligencia || 'Sem diligência definida';
    document.getElementById('s-ultimoMov').value = p.ultimoMovimento || '';
    document.getElementById('s-dataMov').value = p.dataUltimoMovimento || '';
    document.getElementById('s-situacao').value = p.situacaoAtual || '';
    document.getElementById('s-diligencia').value = p.diligencia || '';
    const prioAtual = p.prioridade === 'urgente' ? 'urgente' : 'atencao';
    document.getElementById('s-prioridade').value = prioAtual;
    document.getElementById('prio-urgente').checked = prioAtual === 'urgente';
    document.getElementById('prio-atencao').checked = prioAtual === 'atencao';
    document.getElementById('s-comentario').value = '';
    document.getElementById('s-autor').value = '';
    document.getElementById('modal-status').style.display = 'flex';
  }

  function renderComentarios() {
    const coments = (processoAtivo.comentarios||[]);
    const comentHTML = coments.length
      ? coments.map((c,i) => `<div class="coment-item">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
            <div>
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px">
                <strong style="font-size:12px;color:#0f172a">${esc(c.autor)}</strong>
                ${c.data ? `<span style="background:#e2e8f0;color:#475569;font-size:10px;font-weight:600;border-radius:4px;padding:2px 6px">📅 ${esc(c.data)}</span>` : ''}
              </div>
              <p style="font-size:12px;color:#475569;line-height:1.5">${esc(c.texto)}</p>
            </div>
            <button class="btn-del-coment" data-idx="${i}" title="Excluir comentário">✕</button>
          </div>
        </div>`).join('')
      : '<div class="td-muted" style="padding:8px 0">Nenhum comentário ainda.</div>';
    document.getElementById('coments-lista').innerHTML = comentHTML;
    document.querySelectorAll('.btn-del-coment').forEach(b => b.onclick = () => excluirComentario(parseInt(b.dataset.idx)));
  }

  async function excluirComentario(idx) {
    if (!confirm('Excluir este comentário?')) return;
    const coments = [...(processoAtivo.comentarios||[])];
    coments.splice(idx, 1);
    try {
      await updateDoc(doc(db, 'processos', processoAtivo.fbId), {
        comentarios: coments, atualizadoEm: serverTimestamp()
      });
      processoAtivo.comentarios = coments;
      renderComentarios();
      mostrarToast('Comentário excluído.', 'ok');
    } catch(e) { mostrarToast('Erro ao excluir comentário.', 'erro'); }
  }

  function submitStatus() {
    const novoComent = document.getElementById('s-comentario').value.trim();
    const autorComent = document.getElementById('s-autor').value.trim() || 'Equipe';
    const coments = [...(processoAtivo.comentarios||[])];
    if (novoComent) {
      coments.push({ autor: autorComent, texto: novoComent, data: new Date().toLocaleDateString('pt-BR') });
    }
    const dados = {
      ultimoMovimento: document.getElementById('s-ultimoMov').value.trim(),
      dataUltimoMovimento: document.getElementById('s-dataMov').value,
      situacaoAtual: document.getElementById('s-situacao').value.trim(),
      diligencia: document.getElementById('s-diligencia').value.trim(),
      prioridade: document.querySelector('input[name="prio"]:checked')?.value || 'atencao',
      comentarios: coments,
    };
    salvarStatus(dados);
  }

  function fecharModal() {
    document.getElementById('modal-edicao').style.display = 'none';
    document.getElementById('modal-status').style.display = 'none';
    modalModo = null; processoAtivo = null;
  }

  // ── ABA ──
  function setAba(aba) {
    abaAtual = aba;
    document.querySelectorAll('.tab').forEach((t,i) => {
      t.classList.toggle('active', (i===0&&aba==='painel')||(i===1&&aba==='todos'));
    });
    document.getElementById('page-painel').style.display = aba==='painel' ? 'block' : 'none';
    document.getElementById('page-todos').style.display = aba==='todos' ? 'block' : 'none';
    renderAtivo();
  }

  // ── TOAST ──
  function mostrarToast(msg, tipo) {
    const t = document.getElementById('toast');
    t.textContent = (tipo==='ok'?'✓ ':tipo==='erro'?'✗ ':'ℹ ') + msg;
    t.className = 'toast show toast-'+tipo;
    setTimeout(() => t.className = 'toast', 3000);
  }

  // ── POPULAR FILTROS ──
  function popularFiltros() {
    const selTrib = document.getElementById('filtroTribunal');
    const tribunais = [...new Set(processos.map(p=>p.tribunal))].filter(Boolean).sort();
    selTrib.innerHTML = '<option value="">Todos os tribunais</option>' + tribunais.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('');

    const selFase = document.getElementById('filtroFase');
    const fases = [...new Set(processos.map(p=>p.fase))].filter(Boolean).sort();
    selFase.innerHTML = '<option value="">Todas as fases</option>' + fases.map(f=>`<option value="${esc(f)}">${esc(f)}</option>`).join('');
  }

  // ── EXPOR FUNÇÕES PARA HTML ──
  window.setAba = setAba;
  window.abrirNovo = abrirNovo;
  window.fecharModal = fecharModal;
  window.submitForm = submitForm;
  window.submitStatus = submitStatus;
  window.renderAtivo = renderAtivo;

  // ── INIT ──
  document.addEventListener('DOMContentLoaded', async () => {
    mostrarToast('Conectando ao banco de dados...', 'info');

<div id="tela-acesso" style="display:none;position:fixed;inset:0;background:#f1f5f9;z-index:9999;display:flex;align-items:center;justify-content:center">
  <div style="background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:40px 36px;max-width:380px;width:90%;box-shadow:0 4px 24px #0000001a;text-align:center">

    <input id="campo-senha" type="password" placeholder="Digite a senha de acesso"
      style="width:100%;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:12px 14px;font-size:14px;outline:none;margin-bottom:12px;box-sizing:border-box;text-align:center"
      onkeydown="if(event.key==='Enter') verificarSenha()">
    <div id="erro-senha" style="color:#ef4444;font-size:12px;margin-bottom:10px;display:none">Senha incorreta. Tente novamente.</div>
    <button onclick="verificarSenha()"
      style="width:100%;background:#2563eb;color:#fff;border:none;border-radius:8px;padding:12px;font-size:14px;font-weight:600;cursor:pointer">
      Entrar
    </button>
    <div style="font-size:11px;color:#94a3b8;margin-top:20px">Acesso restrito · Uso interno</div>
  </div>
</div>

<script>
  // ══════════════════════════════════
  // SENHA DE ACESSO — altere aqui
  const SENHA_ACESSO = "124455";
  // ══════════════════════════════════

  function verificarSenha() {
    const campo = document.getElementById('campo-senha');
    const erro = document.getElementById('erro-senha');
    if (campo.value === SENHA_ACESSO) {
      sessionStorage.setItem('acesso_liberado', '1');
      document.getElementById('tela-acesso').style.display = 'none';
    } else {
      erro.style.display = 'block';
      campo.value = '';
      campo.focus();
    }
  }

  // Verificar ao carregar
  if (sessionStorage.getItem('acesso_liberado') !== '1') {
    document.getElementById('tela-acesso').style.display = 'flex';
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('campo-senha').focus();
    });
  } else {
    document.getElementById('tela-acesso').style.display = 'none';
  }
</script>
